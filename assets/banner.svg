<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="324" viewBox="0 0 1000 324" role="img" aria-label="Users &amp; Groups: Offboarding Friday">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e3a5f"/></linearGradient><radialGradient id="glow" cx=".85" cy=".5" r=".6"><stop offset="0" stop-color="#4ade80" stop-opacity=".28"/><stop offset="1" stop-color="#4ade80" stop-opacity="0"/></radialGradient></defs>
<rect width="1000" height="324" rx="18" fill="url(#bg)"/><rect width="1000" height="324" rx="18" fill="url(#glow)"/>
<circle cx="60" cy="40" r="3" fill="#4ade80" opacity=".7"><animate attributeName="opacity" values=".2;.9;.2" dur="3s" repeatCount="indefinite"/></circle>
<text x="48" y="64" font-size="14" letter-spacing="3" fill="#4ade80" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-weight="700">DEVOPS BOOTCAMP · LAB</text>
<text x="48" y="112" font-size="40" font-weight="800" fill="#ffffff" font-family="Segoe UI,Helvetica,Arial,sans-serif">Users &amp; Groups:</text>
<text x="48" y="160" font-size="40" font-weight="800" fill="#ffffff" font-family="Segoe UI,Helvetica,Arial,sans-serif">Offboarding Friday</text>
<text x="48" y="190" font-size="15" fill="#e2e8f0" opacity=".92" font-family="Segoe UI,Helvetica,Arial,sans-serif">A senior developer leaves today. Audit a messy server, find the</text>
<text x="48" y="212" font-size="15" fill="#e2e8f0" opacity=".92" font-family="Segoe UI,Helvetica,Arial,sans-serif">accounts nobody remembers, and remove access cleanly without breaking</text>
<text x="48" y="234" font-size="15" fill="#e2e8f0" opacity=".92" font-family="Segoe UI,Helvetica,Arial,sans-serif">anything.</text>
<rect x="48" y="266" width="105" height="32" rx="16" fill="#ffffff" fill-opacity=".14" stroke="#4ade80" stroke-opacity=".7"/><text x="62" y="287" font-size="14" fill="#ffffff" font-family="Segoe UI,Helvetica,Arial,sans-serif">60-75 min</text>
<rect x="165" y="266" width="114" height="32" rx="16" fill="#ffffff" fill-opacity=".14" stroke="#4ade80" stroke-opacity=".7"/><text x="179" y="287" font-size="14" fill="#ffffff" font-family="Segoe UI,Helvetica,Arial,sans-serif">Cost: free</text>
<g transform="translate(750,62)">
<rect x="0" y="20" width="220" height="150" rx="10" fill="#0b1220" stroke="#4ade80" stroke-opacity=".5"/>
<circle cx="16" cy="36" r="5" fill="#f87171"/><circle cx="32" cy="36" r="5" fill="#fbbf24"/><circle cx="48" cy="36" r="5" fill="#4ade80"/>
<rect x="16" y="62" width="0" height="8" rx="4" fill="#4ade80" opacity=".85"><animate attributeName="width" values="0;120;120;0" keyTimes="0;.25;.85;1" dur="6s" begin="-3.5s" repeatCount="indefinite"/></rect>
<rect x="16" y="86" width="0" height="8" rx="4" fill="#4ade80" opacity=".85"><animate attributeName="width" values="0;160;160;0" keyTimes="0;.25;.85;1" dur="6s" begin="-2.3s" repeatCount="indefinite"/></rect>
<rect x="16" y="110" width="0" height="8" rx="4" fill="#4ade80" opacity=".85"><animate attributeName="width" values="0;90;90;0" keyTimes="0;.25;.85;1" dur="6s" begin="-1.1s" repeatCount="indefinite"/></rect>
<rect x="16" y="134" width="0" height="8" rx="4" fill="#4ade80" opacity=".85"><animate attributeName="width" values="0;140;140;0" keyTimes="0;.25;.85;1" dur="6s" begin="0.1s" repeatCount="indefinite"/></rect>
<rect x="16" y="152" width="10" height="14" fill="#4ade80"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect>
</g>
</svg>